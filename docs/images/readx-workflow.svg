<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ReadX paper reading workflow</title>
  <desc id="desc">Import a paper, recognize layout, translate, read side by side, analyze with AI, and export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faf7"/><stop offset="1" stop-color="#edf4ef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#163d30" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8aa99a"/></marker>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="48" y="56" fill="#183d31" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">从论文文件，到可继续探索的研究笔记</text>
  <text x="48" y="84" fill="#60766b" font-family="Segoe UI,Arial,sans-serif" font-size="14">ReadX 把版面识别、翻译阅读和论文分析放进同一个本地工作区</text>
  <g stroke="#8aa99a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M224 196h30"/><path d="M448 196h30"/><path d="M672 196h30"/><path d="M896 196h30"/>
  </g>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(48 118)">
      <rect width="176" height="154" rx="18" fill="#fff" stroke="#dce8df"/>
      <circle cx="28" cy="29" r="16" fill="#e7f2e9"/><text x="28" y="34" text-anchor="middle" fill="#276653" font-size="13" font-weight="700">01</text>
      <path d="M65 25h48l17 17v49H65z" fill="#f7faf7" stroke="#82a794" stroke-width="2"/><path d="M113 25v18h17M76 55h42M76 65h42M76 75h31" fill="none" stroke="#82a794" stroke-width="2" stroke-linecap="round"/>
