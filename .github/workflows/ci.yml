name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows · Go + web + desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/apps/server/go.mod
          cache-dependency-path: windows/apps/server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        working-directory: windows
        run: npm ci

      - name: 安装 Lee PDF 运行时依赖
        shell: bash
        run: |
          python -m pip install --only-binary=:all: \
            Pillow==10.4.0 PyMuPDF==1.26.5 pikepdf==10.13.0.post1 \
            requests==2.32.5 urllib3==2.5.0

      - name: 安装 Typst 渲染运行时
        shell: pwsh
        run: |
          $version = '0.15.1'
          $archiveName = 'typst-x86_64-pc-windows-msvc.zip'
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $url = "https://github.com/typst/typst/releases/download/v$version/$archiveName"
          $expectedSha256 = '19ce3551153c2fe7ee9fa2f95208310c8f4d3209fedb699e0333faf8913f6736'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Typst $version archive checksum mismatch: $actualSha256"
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP "readx-typst-$version"
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
          $typst = Get-ChildItem -LiteralPath $extractRoot -Filter typst.exe -File -Recurse | Select-Object -First 1
          if (-not $typst) { throw "Typst $version archive did not contain typst.exe." }
          "TYPST_BIN=$($typst.FullName)" >> $env:GITHUB_ENV

      - name: gofmt（源码统一 LF，见 .gitattributes）
        working-directory: windows/apps/server
        shell: bash
        run: test -z "$(gofmt -l .)"

      # npm test = go test ./... + shared 单测 + 三个包的 typecheck
      - name: 测试与类型检查
        working-directory: windows
        run: npm test

  macos:
    name: macOS · Go + web + Electron + PDF runtime
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: macos/apps/server/go.mod
          cache-dependency-path: macos/apps/server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: macos/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        working-directory: macos
        run: npm ci
      - name: Prepare OCR / translation / rendering runtime
        working-directory: macos
        run: npm run setup:runtime && npm run check:runtime
      - name: Test and build
        working-directory: macos
        run: |
          export READX_PYTHON="$PWD/.retain-runtime/bin/python3"
          export TYPST_BIN="$PWD/.retain-runtime/typst/typst"
          npm test
          npm run build
      - name: Import component regression
        working-directory: macos
        run: npm run test:import
      - name: Electron desktop regression
        working-directory: macos
        run: npm run test:desktop
      - name: Prepare and package app (local unsigned validation)
        working-directory: macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node scripts/prepare-release.mjs
          npm exec --workspace=@cbct/desktop -- electron-builder --mac --dir --publish never
          npm run test:packaged
