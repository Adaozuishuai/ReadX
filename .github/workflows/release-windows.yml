name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build ReadX Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/apps/server/go.mod
          cache-dependency-path: windows/apps/server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JavaScript dependencies
        working-directory: windows
        run: npm ci

      - name: Draft release with feature notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesPath = "windows/release-notes/$env:GITHUB_REF_NAME.md"
          if (Test-Path $notesPath) {
            gh release create "$env:GITHUB_REF_NAME" --draft --title "ReadX $env:GITHUB_REF_NAME" --notes-file $notesPath
          } else {
            gh release create "$env:GITHUB_REF_NAME" --draft --title "ReadX $env:GITHUB_REF_NAME" --generate-notes
          }

      - name: Build self-contained installer
        working-directory: windows
        run: npm run build:release:publish
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release after update assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseId = gh release view $env:GITHUB_REF_NAME --json databaseId --jq .databaseId
          if (-not $releaseId) { throw 'ReadX release was not created.' }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -F draft=false
