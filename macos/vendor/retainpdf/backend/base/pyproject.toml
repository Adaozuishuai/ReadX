[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainpdf-base"
version = "4.2.6"
description = "RetainPDF worker foundation shared by the pipeline and translation: stage events, stdout labels, JSON IO, paths, local secrets"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "retainpdf_base*",
]
