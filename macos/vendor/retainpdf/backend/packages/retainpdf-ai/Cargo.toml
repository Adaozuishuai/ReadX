[package]
name = "retainpdf-ai"
version = "0.1.0"
edition = "2021"
description = "AI：问答网关、Agent 计算和运行时会话、文档操作"

[features]
# 只给 rust_api 测试用的导出（文档操作的执行器、控制器、程序哈希）；rust_api 的 dev-dependencies 打开它，生产构建不带。
test-fixtures = []

[dependencies]
retainpdf-api-base = { path = "../retainpdf-api-base" }
retainpdf-core = { path = "../retainpdf-core" }
retainpdf-data = { path = "../retainpdf-data" }
retainpdf-proc = { path = "../retainpdf-proc" }
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
fastrand = "2"
futures-util = "0.3"
getrandom = "0.2"
hmac = "0.13"
lopdf = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
walkdir = "2"
