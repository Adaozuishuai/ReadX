[package]
name = "retainpdf-api-base"
version = "0.1.0"
edition = "2021"
description = "API 各领域包共用的底座：错误类型 AppError 和按编号读出任务（job_loading）"

[features]
# 只给测试用的小工具（找项目的 Python 环境、最小 PDF）；rust_api 和领域包的 dev-dependencies 打开它，生产构建不带。
test-fixtures = []

[dependencies]
retainpdf-core = { path = "../retainpdf-core" }
retainpdf-data = { path = "../retainpdf-data" }
anyhow = "1"
axum = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
