[package]
name = "retainpdf-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
retainpdf-core = { path = "../retainpdf-core" }
retainpdf-data = { path = "../retainpdf-data" }
retainpdf-proc = { path = "../retainpdf-proc" }
anyhow = "1"
base64 = "0.22"
fastrand = "2"
futures-util = "0.3"
getrandom = "0.2"
libc = "0.2"
lopdf = "0.32"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
