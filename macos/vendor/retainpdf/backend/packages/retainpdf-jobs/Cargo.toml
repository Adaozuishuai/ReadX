[package]
name = "retainpdf-jobs"
version = "0.1.0"
edition = "2021"
description = "任务：按 9 类分（任务、操作、进度、文件、报告、阅读、译文、数据、AI），含建任务、质量报告、模型用量"

[features]
# 只给 rust_api 测试用的导出（建任务的内部函数、测试用的临时库和假渲染器……）；rust_api 的 dev-dependencies 打开它，生产构建不带。
test-fixtures = ["dep:rusqlite"]

[dependencies]
retainpdf-api-base = { path = "../retainpdf-api-base" }
retainpdf-accounts = { path = "../retainpdf-accounts" }
retainpdf-core = { path = "../retainpdf-core" }
retainpdf-data = { path = "../retainpdf-data" }
retainpdf-files = { path = "../retainpdf-files" }
retainpdf-glossaries = { path = "../retainpdf-glossaries" }
retainpdf-ingest = { path = "../retainpdf-ingest" }
retainpdf-proc = { path = "../retainpdf-proc" }
retainpdf-providers = { path = "../retainpdf-providers" }
retainpdf-runner = { path = "../retainpdf-runner" }
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
fastrand = "2"
lopdf = "0.32"
mime_guess = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
walkdir = "2"

[dev-dependencies]
retainpdf-ingest = { path = "../retainpdf-ingest", features = ["test-fixtures"] }
rusqlite = { version = "0.31", features = ["bundled"] }
