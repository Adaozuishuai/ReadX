[package]
name = "retainpdf-db"
version = "0.1.0"
edition = "2021"

[dependencies]
retainpdf-core = { path = "../../backend/packages/retainpdf-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
fastrand = "2"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
