[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainpdf-math"
version = "4.2.6"
description = "RetainPDF formula handling: LaTeX command registry, static checks, and render checks against the layout engine"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "retainpdf_math*",
]

[tool.setuptools.package-data]
# registry.py 用 Path(__file__).with_name("latex_commands.json") 读登记表；漏声明会让 wheel 丢掉
# 这个 json，import 期就 FileNotFoundError（#135 就是 Docker 镜像缺了它，OCR worker 启动即崩）。
"retainpdf_math" = ["*.json"]
